name: Read-Only Gateway VM Metadata Diagnostic

on:
  workflow_dispatch:
    inputs:
      target:
        description: One gateway target from IB_GATEWAY_TARGETS_JSON
        required: false
        type: string
      match_current_gateway:
        description: Compare the current private Gateway host against all four configured targets
        required: true
        default: false
        type: boolean
      inspect_connections:
        description: Passively inspect container and socket state for the protected matched target
        required: true
        default: false
        type: boolean
      inspect_ssh_policy:
        description: Read effective SSH policy metadata for the protected matched target
        required: true
        default: false
        type: boolean
      inspect_ssh_key_binding:
        description: Compare the protected target SSH public key with effective VM SSH metadata
        required: true
        default: false
        type: boolean
      remaining_gateways:
        description: Read VM metadata for protected inventory targets other than the already completed target
        required: true
        default: false
        type: boolean

concurrency:
  group: read-only-gateway-vm-metadata-${{ inputs.match_current_gateway && 'match-current' || inputs.target }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Checkout protected-index parser
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: resolve
        name: Resolve one gateway target
        env:
          MATCH_CURRENT_GATEWAY: ${{ inputs.match_current_gateway }}
          INSPECT_CONNECTIONS: ${{ inputs.inspect_connections }}
          INSPECT_SSH_POLICY: ${{ inputs.inspect_ssh_policy }}
          INSPECT_SSH_KEY_BINDING: ${{ inputs.inspect_ssh_key_binding }}
          REMAINING_GATEWAYS: ${{ inputs.remaining_gateways }}
          MATCH_TARGETS_JSON: ${{ inputs.match_current_gateway && secrets.IB_GATEWAY_TARGETS_JSON || '' }}
          MATCHED_INDEX: ${{ (inputs.inspect_connections || inputs.inspect_ssh_policy || inputs.remaining_gateways) && secrets.IB_GATEWAY_MATCHED_INDEX || '' }}
          LEGACY_TARGETS_JSON: ${{ !inputs.match_current_gateway && vars.IB_GATEWAY_TARGETS_JSON || '' }}
          SELECTED_TARGET: ${{ inputs.target }}
        uses: actions/github-script@v8
        with:
          script: |
            const { parseProtectedGatewayIndex } = require(`${process.env.GITHUB_WORKSPACE}/scripts/parse_protected_gateway_index.cjs`);
            const matchMode = process.env.MATCH_CURRENT_GATEWAY === "true";
            const inspectConnections = process.env.INSPECT_CONNECTIONS === "true";
            const inspectSshPolicy = process.env.INSPECT_SSH_POLICY === "true";
            const inspectSshKeyBinding = process.env.INSPECT_SSH_KEY_BINDING === "true";
            const remainingGateways = process.env.REMAINING_GATEWAYS === "true";
            if ((inspectConnections || inspectSshPolicy || inspectSshKeyBinding) && !matchMode) {
              core.setFailed("Passive inspection requires protected current-gateway matching");
              return;
            }
            if (remainingGateways && (!matchMode || inspectSshPolicy || inspectSshKeyBinding)) {
              core.setFailed("Remaining gateway inspection requires protected metadata or passive-connection mode");
              return;
            }
            if (inspectSshKeyBinding && !inspectSshPolicy) {
              core.setFailed("SSH key binding requires SSH policy inspection");
              return;
            }
            if (inspectConnections && inspectSshPolicy) {
              core.setFailed("SSH policy inspection cannot be combined with connection inspection");
              return;
            }
            if (inspectConnections && inspectSshKeyBinding) {
              core.setFailed("SSH key binding cannot be combined with connection inspection");
              return;
            }
            const raw = matchMode ? process.env.MATCH_TARGETS_JSON : process.env.LEGACY_TARGETS_JSON;
            if (!raw || !raw.trim()) {
              core.setFailed(matchMode ? "Protected gateway target inventory is required" : "IB_GATEWAY_TARGETS_JSON is required");
              return;
            }
            let loaded;
            let targets;
            try {
              loaded = JSON.parse(raw);
              targets = Array.isArray(loaded)
                ? loaded
                : Object.entries(loaded).map(([name, config]) => ({...config, name}));
            } catch {
              core.setFailed(matchMode ? "Protected gateway target inventory is invalid" : "IB_GATEWAY_TARGETS_JSON is invalid");
              return;
            }
            if (matchMode) {
              const required = [
                "gcp_project_id",
                "gcp_workload_identity_provider",
                "gcp_workload_identity_service_account",
                "gce_instance_name",
                "gce_zone",
              ];
              const names = new Set();
              if (targets.length !== 4 || targets.some((target) => {
                if (!target || typeof target.name !== "string" || !target.name.trim() || names.has(target.name)) return true;
                names.add(target.name);
                return required.some((key) => typeof target[key] !== "string" || !target[key].trim());
              })) {
                core.setFailed("Protected gateway target inventory is invalid");
                return;
              }
              if (remainingGateways) {
                const matchedIndex = parseProtectedGatewayIndex(process.env.MATCHED_INDEX);
                if (matchedIndex === undefined) {
                  core.setFailed("Protected matched target index is unavailable");
                  return;
                }
                const remainingTargets = targets
                  .map((target, target_index) => ({ target, target_index }))
                  .filter(({ target_index }) => target_index !== matchedIndex);
                const invalidTarget = remainingTargets.some(({ target }) => {
                  if (!/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(target.gcp_project_id) ||
                      !/^[a-z]([-a-z0-9]*[a-z0-9])?$/.test(target.gce_instance_name) ||
                      !/^[a-z]+(?:-[a-z]+)*[0-9]+-[a-z]$/.test(target.gce_zone)) return true;
                  if (!inspectConnections) return false;
                  const secretProject = target.gcp_secret_project_id || target.gcp_project_id;
                  return !/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(secretProject) ||
                    !/^[A-Za-z_][A-Za-z0-9_.-]*$/.test(target.gce_user || "") ||
                    !/^[A-Za-z0-9_-]+$/.test(target.ssh_private_key_secret_name || "") ||
                    !/^[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(target.container_name || "") ||
                    !["paper", "live"].includes(target.mode);
                });
                if (invalidTarget) {
                  core.setFailed(inspectConnections
                    ? "Protected remaining target connection configuration is incomplete"
                    : "Protected remaining target metadata configuration is incomplete");
                  return;
                }
                core.setOutput("matrix", JSON.stringify({include: remainingTargets.map(({ target_index }) => ({
                  target_index,
                  inspect_connections: inspectConnections,
                  inspect_ssh_policy: false,
                }))}));
                return;
              }
              if (inspectConnections || inspectSshPolicy || inspectSshKeyBinding) {
                const selectedIndex = parseProtectedGatewayIndex(process.env.MATCHED_INDEX);
                if (selectedIndex === undefined) {
                  core.setFailed("Protected matched target index is unavailable");
                  return;
                }
                const target = targets[selectedIndex];
                if (inspectConnections && (!target || !/^[A-Za-z_][A-Za-z0-9_.-]*$/.test(target.gce_user || "") ||
                    !/^[A-Za-z0-9_-]+$/.test(target.ssh_private_key_secret_name || "") ||
                    !/^[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(target.container_name || "") ||
                    !["paper", "live"].includes(target.mode))) {
                  core.setFailed("Protected matched target connection configuration is incomplete");
                  return;
                }
                if (inspectSshKeyBinding && (!target ||
                    !/^[A-Za-z_][A-Za-z0-9_.-]*$/.test(target.gce_user || "") ||
                    !/^[A-Za-z0-9_-]+$/.test(target.ssh_private_key_secret_name || "") ||
                    !/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(target.gcp_secret_project_id || target.gcp_project_id || ""))) {
                  core.setFailed("Protected matched target SSH key configuration is incomplete");
                  return;
                }
                core.setOutput("matrix", JSON.stringify({include: [{target_index: selectedIndex, inspect_connections: inspectConnections, inspect_ssh_policy: inspectSshPolicy}]}));
                return;
              }
              core.setOutput("matrix", JSON.stringify({include: targets.map((_, target_index) => ({target_index}))}));
              return;
            }
            const selectedName = process.env.SELECTED_TARGET;
            const targetIndex = targets.findIndex((target) => target && target.name === selectedName);
            if (targetIndex < 0) {
              core.setFailed("Unknown gateway target; choose one configured target");
              return;
            }
            const target = targets[targetIndex];
            const crypto = require("crypto");
            core.setOutput("matrix", JSON.stringify({include: [{
              target_index: targetIndex,
              target_digest: crypto.createHash("sha256").update(JSON.stringify(target)).digest("hex")
            }]}));

  diagnose:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: ${{ !inputs.remaining_gateways }}
      max-parallel: ${{ inputs.remaining_gateways && 3 || 1 }}
      matrix: ${{ fromJson(needs.resolve.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout diagnostic classifier
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: metadata
        name: Resolve masked VM metadata
        env:
          MATCH_CURRENT_GATEWAY: ${{ inputs.match_current_gateway }}
          INSPECT_CONNECTIONS: ${{ inputs.inspect_connections }}
          INSPECT_SSH_POLICY: ${{ inputs.inspect_ssh_policy }}
          INSPECT_SSH_KEY_BINDING: ${{ inputs.inspect_ssh_key_binding }}
          REMAINING_GATEWAYS: ${{ inputs.remaining_gateways }}
          MATCH_TARGETS_JSON: ${{ inputs.match_current_gateway && secrets.IB_GATEWAY_TARGETS_JSON || '' }}
          MATCHED_INDEX: ${{ (inputs.inspect_connections || inputs.inspect_ssh_policy || inputs.remaining_gateways) && secrets.IB_GATEWAY_MATCHED_INDEX || '' }}
          LEGACY_TARGETS_JSON: ${{ !inputs.match_current_gateway && vars.IB_GATEWAY_TARGETS_JSON || '' }}
          SELECTED_TARGET: ${{ inputs.target }}
          TARGET_INDEX: ${{ matrix.target_index }}
          TARGET_DIGEST: ${{ matrix.target_digest }}
        uses: actions/github-script@v8
        with:
          script: |
            const { parseProtectedGatewayIndex } = require(`${process.env.GITHUB_WORKSPACE}/scripts/parse_protected_gateway_index.cjs`);
            const matchMode = process.env.MATCH_CURRENT_GATEWAY === "true";
            const inspectConnections = process.env.INSPECT_CONNECTIONS === "true";
            const inspectSshPolicy = process.env.INSPECT_SSH_POLICY === "true";
            const inspectSshKeyBinding = process.env.INSPECT_SSH_KEY_BINDING === "true";
            const remainingGateways = process.env.REMAINING_GATEWAYS === "true";
            if (remainingGateways && (!matchMode || inspectSshPolicy || inspectSshKeyBinding)) {
              core.setFailed("Remaining gateway inspection requires protected metadata or passive-connection mode");
              return;
            }
            const raw = matchMode ? process.env.MATCH_TARGETS_JSON : process.env.LEGACY_TARGETS_JSON;
            if (!raw || !raw.trim()) {
              core.setFailed(matchMode ? "Protected gateway target inventory is required" : "IB_GATEWAY_TARGETS_JSON is required");
              return;
            }
            let loaded;
            let targets;
            try {
              loaded = JSON.parse(raw);
              targets = Array.isArray(loaded)
                ? loaded
                : Object.entries(loaded).map(([name, config]) => ({...config, name}));
            } catch {
              core.setFailed(matchMode ? "Protected gateway target inventory is invalid" : "IB_GATEWAY_TARGETS_JSON is invalid");
              return;
            }
            const targetIndex = Number(process.env.TARGET_INDEX);
            let target;
            if (matchMode) {
              const required = [
                "gcp_project_id",
                "gcp_workload_identity_provider",
                "gcp_workload_identity_service_account",
                "gce_instance_name",
                "gce_zone",
              ];
              const names = new Set();
              if (targets.length !== 4 || targets.some((item) => {
                if (!item || typeof item.name !== "string" || !item.name.trim() || names.has(item.name)) return true;
                names.add(item.name);
                return required.some((key) => typeof item[key] !== "string" || !item[key].trim());
              })) {
                core.setFailed("Protected gateway target inventory is invalid");
                return;
              }
              const matchedIndex = (inspectConnections || inspectSshPolicy || inspectSshKeyBinding || remainingGateways) ? parseProtectedGatewayIndex(process.env.MATCHED_INDEX) : undefined;
              if ((inspectConnections || inspectSshPolicy || inspectSshKeyBinding) && !remainingGateways &&
                  (matchedIndex === undefined || matchedIndex !== targetIndex)) {
                core.setFailed("Protected matched target index is unavailable");
                return;
              }
              if (remainingGateways && matchedIndex === undefined) {
                core.setFailed("Protected matched target index is unavailable");
                return;
              }
              if (remainingGateways && matchedIndex === targetIndex) {
                core.setFailed("Resolved gateway target is not an eligible remaining target");
                return;
              }
              target = targets[targetIndex];
              if (remainingGateways &&
                  (!/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(String(target?.gcp_project_id || "")) ||
                   !/^[a-z]([-a-z0-9]*[a-z0-9])?$/.test(String(target?.gce_instance_name || "")) ||
                   !/^[a-z]+(?:-[a-z]+)*[0-9]+-[a-z]$/.test(String(target?.gce_zone || "")))) {
                core.setFailed("Protected remaining target metadata configuration is incomplete");
                return;
              }
              if (remainingGateways && inspectConnections) {
                const secretProject = target.gcp_secret_project_id || target.gcp_project_id;
                if (!/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(String(secretProject || "")) ||
                    !/^[A-Za-z_][A-Za-z0-9_.-]*$/.test(String(target.gce_user || "")) ||
                    !/^[A-Za-z0-9_-]+$/.test(String(target.ssh_private_key_secret_name || "")) ||
                    !/^[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(String(target.container_name || "")) ||
                    !["paper", "live"].includes(target.mode)) {
                  core.setFailed("Protected remaining target connection configuration is incomplete");
                  return;
                }
              }
            } else {
              target = targets[targetIndex];
              const crypto = require("crypto");
              if (!target || crypto.createHash("sha256").update(JSON.stringify(target)).digest("hex") !== process.env.TARGET_DIGEST) {
                core.setFailed("Resolved gateway target changed between jobs");
                return;
              }
            }
            if (!target || !Number.isInteger(targetIndex) || targetIndex < 0 || targetIndex >= targets.length) {
              core.setFailed("Resolved gateway target is invalid");
              return;
            }
            const values = {
              GCP_PROJECT_ID: target.gcp_project_id,
              GCP_WORKLOAD_IDENTITY_PROVIDER: target.gcp_workload_identity_provider,
              GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: target.gcp_workload_identity_service_account,
              GCE_INSTANCE_NAME: target.gce_instance_name,
              GCE_ZONE: target.gce_zone,
            };
            if (inspectConnections || inspectSshPolicy) {
              if (!/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(String(target.gcp_project_id || "")) ||
                  !/^[a-z]([-a-z0-9]*[a-z0-9])?$/.test(String(target.gce_instance_name || "")) ||
                  !/^[a-z]+(?:-[a-z]+)*[0-9]+-[a-z]$/.test(String(target.gce_zone || ""))) {
                core.setFailed("Protected matched target metadata configuration is incomplete");
                return;
              }
            }
            if (inspectConnections) {
              const requiredConnectionValues = {
                GCE_USER: target.gce_user,
                SSH_PRIVATE_KEY_SECRET_NAME: target.ssh_private_key_secret_name,
                IB_GATEWAY_CONTAINER_NAME: target.container_name,
                IB_GATEWAY_MODE: target.mode,
              };
              if (!/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(String(target.gcp_project_id || "")) ||
                  !/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(String(target.gcp_secret_project_id || target.gcp_project_id || "")) ||
                  !/^[a-z]([-a-z0-9]*[a-z0-9])?$/.test(String(target.gce_instance_name || "")) ||
                  !/^[a-z]+(?:-[a-z]+)*[0-9]+-[a-z]$/.test(String(target.gce_zone || "")) ||
                  !/^[A-Za-z_][A-Za-z0-9_.-]*$/.test(String(requiredConnectionValues.GCE_USER || "")) ||
                  !/^[A-Za-z0-9_-]+$/.test(String(requiredConnectionValues.SSH_PRIVATE_KEY_SECRET_NAME || "")) ||
                  !/^[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(String(requiredConnectionValues.IB_GATEWAY_CONTAINER_NAME || "")) ||
                  !["paper", "live"].includes(requiredConnectionValues.IB_GATEWAY_MODE)) {
                core.setFailed("Protected matched target connection configuration is incomplete");
                return;
              }
              for (const [name, value] of Object.entries(requiredConnectionValues)) {
                core.setSecret(String(value));
                if (name === "SSH_PRIVATE_KEY_SECRET_NAME") core.setOutput(name.toLowerCase(), String(value));
                else core.exportVariable(name, String(value));
              }
              // Match the existing Gateway mode contract in scripts/wait_for_ib_gateway_ready.sh.
              core.exportVariable("IB_GATEWAY_API_PORT", requiredConnectionValues.IB_GATEWAY_MODE === "live" ? "4001" : "4002");
              core.setSecret(String(target.gcp_secret_project_id || target.gcp_project_id));
              core.setOutput("gcp_secret_project_id", String(target.gcp_secret_project_id || target.gcp_project_id));
            }
            if (inspectSshKeyBinding) {
              const secretProject = target.gcp_secret_project_id || target.gcp_project_id;
              if (!/^[A-Za-z_][A-Za-z0-9_.-]*$/.test(String(target.gce_user || "")) ||
                  !/^[A-Za-z0-9_-]+$/.test(String(target.ssh_private_key_secret_name || "")) ||
                  !/^[a-z][a-z0-9-]{4,28}[a-z0-9]$/.test(String(secretProject || ""))) {
                core.setFailed("Protected matched target SSH key configuration is incomplete");
                return;
              }
              core.setSecret(String(target.gce_user));
              core.setSecret(String(target.ssh_private_key_secret_name));
              core.setSecret(String(secretProject));
              core.setOutput("gce_user", String(target.gce_user));
              core.setOutput("ssh_private_key_secret_name", String(target.ssh_private_key_secret_name));
              core.setOutput("gcp_secret_project_id", String(secretProject));
            }
            for (const [name, value] of Object.entries(values)) {
              if (!value) {
                core.setFailed("Gateway metadata is incomplete");
                return;
              }
              core.setSecret(String(value));
              if (name.startsWith("GCP_WORKLOAD") || name === "GCP_PROJECT_ID") {
                core.setOutput(name.toLowerCase(), String(value));
              } else {
                core.exportVariable(name, String(value));
              }
            }
            core.exportVariable("MATCH_CURRENT_GATEWAY", matchMode ? "true" : "false");
            core.exportVariable("TARGET_INDEX", String(targetIndex));

      - id: auth_filtered
        name: Authenticate to Google Cloud for passive inspection
        if: ${{ inputs.inspect_connections || inputs.inspect_ssh_policy || inputs.remaining_gateways }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.metadata.outputs.gcp_workload_identity_provider }}
          service_account: ${{ steps.metadata.outputs.gcp_workload_identity_service_account }}
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/filter_github_action_auth_logs.cjs

      - id: auth
        name: Authenticate to Google Cloud
        if: ${{ !inputs.inspect_connections && !inputs.inspect_ssh_policy && !inputs.remaining_gateways }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ steps.metadata.outputs.gcp_workload_identity_provider }}
          service_account: ${{ steps.metadata.outputs.gcp_workload_identity_service_account }}

      - name: Set up gcloud
        if: ${{ !inputs.inspect_connections && !inputs.inspect_ssh_policy && !inputs.remaining_gateways }}
        id: gcloud_setup
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ steps.metadata.outputs.gcp_project_id }}
          version: '>= 416.0.0'

      - name: Set up gcloud for passive inspection
        if: ${{ (inputs.inspect_connections || inputs.inspect_ssh_policy || inputs.remaining_gateways) && steps.auth_filtered.outcome == 'success' }}
        id: gcloud_setup_filtered
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ steps.metadata.outputs.gcp_project_id }}
          version: '>= 416.0.0'
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/filter_github_action_auth_logs.cjs

      - name: Stop if protected cloud access is unavailable
        if: ${{ (inputs.inspect_connections || inputs.inspect_ssh_policy || inputs.remaining_gateways) && (steps.auth_filtered.outcome != 'success' || steps.gcloud_setup_filtered.outcome != 'success') }}
        env:
          TARGET_INDEX: ${{ matrix.target_index }}
        run: |
          if [ "${{ inputs.inspect_ssh_policy }}" = "true" ]; then
            echo "SSH_POLICY=blocked reason=cloud_access_unavailable"
          elif [ "${{ inputs.remaining_gateways }}" = "true" ]; then
            echo "GATEWAY_VM_DIAGNOSTIC_STATUS=UNKNOWN"
            echo "GATEWAY_VM_DIAGNOSTIC_TARGET_INDEX=${TARGET_INDEX}"
            echo "GATEWAY_VM_DIAGNOSTIC_FAILURE_CLASS=CLOUD_ACCESS_UNAVAILABLE"
          else
            echo "GATEWAY_CONNECTION_INSPECTION=blocked reason=cloud_access_unavailable"
          fi
          exit 1

      - id: metadata_check
        name: Read VM metadata without connecting
        env:
          GCP_PROJECT_ID: ${{ steps.metadata.outputs.gcp_project_id }}
          INSPECT_CONNECTIONS: ${{ inputs.inspect_connections }}
          INSPECT_SSH_POLICY: ${{ inputs.inspect_ssh_policy }}
          MATCH_CURRENT_GATEWAY: ${{ inputs.match_current_gateway }}
          TARGET_INDEX: ${{ matrix.target_index }}
          REMAINING_GATEWAYS: ${{ inputs.remaining_gateways }}
          IB_GATEWAY_EXPECTED_HOST: ${{ inputs.match_current_gateway && !inputs.remaining_gateways && secrets.IB_GATEWAY_EXPECTED_HOST || '' }}
        run: |
          set -euo pipefail
          metadata_file="$(mktemp)"
          trap 'rm -f "${metadata_file}"' EXIT
          if ! gcloud compute instances describe "${GCE_INSTANCE_NAME}" \
            --project "${GCP_PROJECT_ID}" \
            --zone "${GCE_ZONE}" \
            --format=json >"${metadata_file}" 2>&1; then
            if [ "${MATCH_CURRENT_GATEWAY}" = "true" ]; then
              if [ "${REMAINING_GATEWAYS}" = "true" ]; then
                echo "GATEWAY_VM_DIAGNOSTIC_STATUS=UNKNOWN"
                echo "GATEWAY_VM_DIAGNOSTIC_TARGET_INDEX=${TARGET_INDEX}"
                python3 scripts/classify_gcloud_metadata_failure.py --input "${metadata_file}"
                exit 1
              fi
              echo "GATEWAY_IP_MATCH_STATUS=unknown"
              echo "GATEWAY_IP_MATCH_INDEX=${TARGET_INDEX}"
              python3 scripts/classify_gcloud_metadata_failure.py --input "${metadata_file}"
              exit 1
            fi
            echo "GATEWAY_VM_DIAGNOSTIC_STATUS=METADATA_UNAVAILABLE"
            python3 scripts/classify_gcloud_metadata_failure.py --input "${metadata_file}"
            exit 1
          fi
          if [ "${MATCH_CURRENT_GATEWAY}" = "true" ]; then
            if [ "${REMAINING_GATEWAYS}" = "true" ]; then
              if EXPECTED_GCP_PROJECT_ID="${GCP_PROJECT_ID}" \
                EXPECTED_GCE_ZONE="${GCE_ZONE}" \
                EXPECTED_GCE_INSTANCE_NAME="${GCE_INSTANCE_NAME}" \
                python3 scripts/match_gateway_metadata.py \
                --metadata-file "${metadata_file}" --target-index "${TARGET_INDEX}" \
                --verify-target-identity; then
                if [ "${INSPECT_CONNECTIONS}" = "true" ]; then
                  echo "gateway_connection_target_verified=true" >> "${GITHUB_OUTPUT}"
                fi
                exit 0
              fi
              exit 1
            fi
            if match_output="$(python3 scripts/match_gateway_metadata.py \
              --metadata-file "${metadata_file}" \
              --target-index "${TARGET_INDEX}")"; then
              match_exit=0
            else
              match_exit=$?
            fi
            printf '%s\n' "${match_output}"
            match_status="$(printf '%s\n' "${match_output}" | sed -n 's/^GATEWAY_IP_MATCH_STATUS=//p')"
            printf 'gateway_ip_match_status=%s\n' "${match_status}" >> "${GITHUB_OUTPUT}"
            if { [ "${INSPECT_CONNECTIONS}" = "true" ] || [ "${INSPECT_SSH_POLICY}" = "true" ]; } && [ "${match_status}" != "match" ]; then
              if [ "${INSPECT_SSH_POLICY}" = "true" ]; then
                echo "SSH_POLICY=blocked reason=metadata_mismatch"
              else
                echo "GATEWAY_CONNECTION_INSPECTION=blocked reason=metadata_mismatch"
              fi
              exit 1
            fi
            if [ "${INSPECT_CONNECTIONS}" = "true" ] && [ "${match_status}" = "match" ]; then
              echo "gateway_connection_target_verified=true" >> "${GITHUB_OUTPUT}"
            fi
            exit "${match_exit}"
          fi
          VM_METADATA_FILE="${metadata_file}" python3 - <<'PY'
          import json
          import os

          payload = json.load(open(os.environ["VM_METADATA_FILE"], encoding="utf-8"))
          status = str(payload.get("status") or "UNKNOWN").upper()
          if status == "RUNNING":
              print("GATEWAY_VM_DIAGNOSTIC_STATUS=VM_RUNNING")
          else:
              print("GATEWAY_VM_DIAGNOSTIC_STATUS=VM_NOT_RUNNING")
          print("GATEWAY_VM_DIAGNOSTIC_LIMIT=NO_GATEWAY_OR_CONTAINER_HEALTH_ASSERTION")
          PY

      - name: Read SSH key into a restricted temporary file
        if: ${{ inputs.inspect_connections && steps.metadata_check.outputs.gateway_connection_target_verified == 'true' }}
        env:
          SSH_PRIVATE_KEY_SECRET_NAME: ${{ steps.metadata.outputs.ssh_private_key_secret_name }}
          GCP_PROJECT_ID: ${{ steps.metadata.outputs.gcp_secret_project_id }}
        run: |
          set -euo pipefail
          key_file="$(mktemp "${RUNNER_TEMP}/gateway-ssh-key.XXXXXX" 2>/dev/null)"
          error_file="$(mktemp "${RUNNER_TEMP}/gateway-secret-error.XXXXXX" 2>/dev/null)"
          key_handed_off=false
          cleanup_secret_fetch() {
            rm -f "${error_file}" 2>/dev/null || true
            if [ "${key_handed_off}" != "true" ]; then rm -f "${key_file}" 2>/dev/null || true; fi
          }
          trap cleanup_secret_fetch EXIT
          if ! chmod 600 "${key_file}" 2>/dev/null; then
            echo "GATEWAY_CONNECTION_INSPECTION=blocked reason=credential_unavailable"
            exit 1
          fi
          if ! gcloud secrets versions access latest \
            --secret="${SSH_PRIVATE_KEY_SECRET_NAME}" \
            --project="${GCP_PROJECT_ID}" >"${key_file}" 2>"${error_file}"; then
            echo "GATEWAY_CONNECTION_INSPECTION=blocked reason=credential_unavailable"
            exit 1
          fi
          if [ ! -s "${key_file}" ]; then
            echo "GATEWAY_CONNECTION_INSPECTION=blocked reason=credential_unavailable"
            exit 1
          fi
          if ! SSH_KEY_FILE="${key_file}" bash scripts/prepare_gateway_ssh_key.sh >/dev/null 2>"${error_file}"; then
            echo "GATEWAY_CONNECTION_INSPECTION=blocked reason=credential_invalid"
            exit 1
          fi
          echo "SSH_KEY_FILE=${key_file}" >> "${GITHUB_ENV}"
          key_handed_off=true

      - id: ssh_policy
        name: Read effective SSH policy metadata without connecting
        if: ${{ inputs.inspect_ssh_policy && steps.metadata_check.outputs.gateway_ip_match_status == 'match' }}
        env:
          GCP_PROJECT_ID: ${{ steps.metadata.outputs.gcp_project_id }}
          GCP_SECRET_PROJECT_ID: ${{ inputs.inspect_ssh_key_binding && steps.metadata.outputs.gcp_secret_project_id || '' }}
          TARGET_INDEX: ${{ matrix.target_index }}
          IB_GATEWAY_EXPECTED_HOST: ${{ secrets.IB_GATEWAY_EXPECTED_HOST }}
          INSPECT_SSH_KEY_BINDING: ${{ inputs.inspect_ssh_key_binding }}
          SSH_PRIVATE_KEY_SECRET_NAME: ${{ inputs.inspect_ssh_key_binding && steps.metadata.outputs.ssh_private_key_secret_name || '' }}
          GCE_USER: ${{ inputs.inspect_ssh_key_binding && steps.metadata.outputs.gce_user || '' }}
        run: |
          set -euo pipefail
          instance_file=""
          project_file=""
          error_file=""
          key_file=""
          cleanup_policy_files() {
            rm -f "${instance_file}" "${project_file}" "${error_file}" 2>/dev/null || true
            if [ -n "${key_file}" ]; then rm -f -- "${key_file}" 2>/dev/null || true; fi
          }
          trap cleanup_policy_files EXIT
          trap 'cleanup_policy_files; exit 1' INT TERM HUP
          if ! instance_file="$(mktemp "${RUNNER_TEMP}/gateway-ssh-policy-instance.XXXXXX" 2>/dev/null)" ||
              ! project_file="$(mktemp "${RUNNER_TEMP}/gateway-ssh-policy-project.XXXXXX" 2>/dev/null)" ||
              ! error_file="$(mktemp "${RUNNER_TEMP}/gateway-ssh-policy-error.XXXXXX" 2>/dev/null)"; then
            echo "SSH_POLICY=blocked reason=metadata_unavailable"
            exit 1
          fi
          if ! chmod 600 "${instance_file}" "${project_file}" "${error_file}" 2>/dev/null; then
            echo "SSH_POLICY=blocked reason=metadata_unavailable"
            exit 1
          fi
          if ! gcloud compute instances describe "${GCE_INSTANCE_NAME}" \
            --project "${GCP_PROJECT_ID}" --zone "${GCE_ZONE}" --format=json >"${instance_file}" 2>"${error_file}"; then
            echo "SSH_POLICY=blocked reason=instance_metadata_unavailable"
            python3 scripts/classify_gcloud_metadata_failure.py --input "${error_file}"
            exit 1
          fi
          if ! match_output="$(IB_GATEWAY_EXPECTED_HOST="${IB_GATEWAY_EXPECTED_HOST}" \
            python3 scripts/match_gateway_metadata.py \
              --metadata-file "${instance_file}" --target-index "${TARGET_INDEX}")"; then
            echo "SSH_POLICY=blocked reason=instance_host_unverified"
            exit 1
          fi
          match_status="$(printf '%s\n' "${match_output}" | sed -n 's/^GATEWAY_IP_MATCH_STATUS=//p')"
          if [ "${match_status}" != "match" ]; then
            echo "SSH_POLICY=blocked reason=instance_host_unverified"
            exit 1
          fi
          if ! gcloud compute project-info describe \
            --project "${GCP_PROJECT_ID}" --format=json >"${project_file}" 2>"${error_file}"; then
            echo "SSH_POLICY=blocked reason=project_metadata_unavailable"
            python3 scripts/classify_gcloud_metadata_failure.py --input "${error_file}"
            exit 1
          fi
          python3 scripts/parse_gateway_ssh_policy.py \
            --instance-file "${instance_file}" --project-file "${project_file}"
          if [ "${INSPECT_SSH_KEY_BINDING}" = "true" ]; then
            if [ -z "${SSH_PRIVATE_KEY_SECRET_NAME}" ] || [ -z "${GCP_SECRET_PROJECT_ID}" ] || [ -z "${GCE_USER}" ]; then
              echo "SSH_KEY_BINDING=unknown"
              echo "SSH_KEY_BINDING_SOURCE=unknown"
              echo "SSH_KEY_BINDING_REASON=key_unavailable"
              exit 1
            fi
            if ! key_file="$(mktemp "${RUNNER_TEMP}/gateway-key-binding-private.XXXXXX" 2>/dev/null)" ||
                ! chmod 600 "${key_file}" 2>/dev/null; then
              echo "SSH_KEY_BINDING=unknown"
              echo "SSH_KEY_BINDING_SOURCE=unknown"
              echo "SSH_KEY_BINDING_REASON=key_unavailable"
              exit 1
            fi
            if ! gcloud secrets versions access latest \
              --secret="${SSH_PRIVATE_KEY_SECRET_NAME}" \
              --project="${GCP_SECRET_PROJECT_ID}" >"${key_file}" 2>"${error_file}" || [ ! -s "${key_file}" ]; then
              echo "SSH_KEY_BINDING=unknown"
              echo "SSH_KEY_BINDING_SOURCE=unknown"
              echo "SSH_KEY_BINDING_REASON=key_unavailable"
              exit 1
            fi
            if ! key_eol_status="$(python3 - "${key_file}" 2>/dev/null <<'PY'
          import sys

          try:
              with open(sys.argv[1], "rb") as key_file:
                  key_file.seek(0, 2)
                  if key_file.tell() == 0:
                      raise OSError
                  key_file.seek(-1, 2)
                  print("present" if key_file.read(1) == b"\n" else "missing")
          except OSError:
              print("unknown")
              raise SystemExit(1)
          PY
          )"; then
              key_eol_status="unknown"
            fi
            case "${key_eol_status}" in
              present|missing) echo "SSH_KEY_INPUT_EOL=${key_eol_status}" ;;
              *)
                echo "SSH_KEY_INPUT_EOL=unknown"
                echo "SSH_KEY_BINDING=unknown"
                echo "SSH_KEY_BINDING_SOURCE=unknown"
                echo "SSH_KEY_BINDING_REASON=inspection_failed"
                exit 1
                ;;
            esac
            if ! SSH_KEY_FILE="${key_file}" bash scripts/prepare_gateway_ssh_key.sh >/dev/null 2>"${error_file}"; then
              echo "SSH_KEY_BINDING=unknown"
              echo "SSH_KEY_BINDING_SOURCE=unknown"
              echo "SSH_KEY_BINDING_REASON=key_invalid"
              exit 1
            fi
            if binding_output="$(GCE_USER="${GCE_USER}" python3 scripts/compare_gateway_ssh_key_binding.py \
              --private-key-file "${key_file}" --instance-file "${instance_file}" \
              --project-file "${project_file}" 2>"${error_file}")"; then
              binding_exit=0
            else
              binding_exit=$?
            fi
            case "${binding_output}" in
              $'SSH_KEY_BINDING=match\nSSH_KEY_BINDING_SOURCE=instance\nSSH_KEY_BINDING_REASON=matched'|\
              $'SSH_KEY_BINDING=match\nSSH_KEY_BINDING_SOURCE=project\nSSH_KEY_BINDING_REASON=matched'|\
              $'SSH_KEY_BINDING=no_match\nSSH_KEY_BINDING_SOURCE=none\nSSH_KEY_BINDING_REASON=key_not_found'|\
              $'SSH_KEY_BINDING=no_match\nSSH_KEY_BINDING_SOURCE=none\nSSH_KEY_BINDING_REASON=key_expired'|\
              $'SSH_KEY_BINDING=unknown\nSSH_KEY_BINDING_SOURCE=unknown\nSSH_KEY_BINDING_REASON=oslogin_enabled'|\
              $'SSH_KEY_BINDING=unknown\nSSH_KEY_BINDING_SOURCE=unknown\nSSH_KEY_BINDING_REASON=metadata_invalid'|\
              $'SSH_KEY_BINDING=unknown\nSSH_KEY_BINDING_SOURCE=unknown\nSSH_KEY_BINDING_REASON=key_invalid'|\
              $'SSH_KEY_BINDING=unknown\nSSH_KEY_BINDING_SOURCE=unknown\nSSH_KEY_BINDING_REASON=username_invalid') ;;
              *)
                echo "SSH_KEY_BINDING=unknown"
                echo "SSH_KEY_BINDING_SOURCE=unknown"
                echo "SSH_KEY_BINDING_REASON=inspection_failed"
                exit 1
                ;;
            esac
            printf '%s\n' "${binding_output}"
            if [ "${binding_exit}" -ne 0 ]; then exit 1; fi
          fi

      - name: Inspect Gateway connections through one IAP SSH session
        if: ${{ inputs.inspect_connections && steps.metadata_check.outputs.gateway_connection_target_verified == 'true' }}
        env:
          GCP_PROJECT_ID: ${{ steps.metadata.outputs.gcp_project_id }}
          TARGET_INDEX: ${{ matrix.target_index }}
        run: |
          set -euo pipefail
          known_hosts="$(mktemp "${RUNNER_TEMP}/gateway-known-hosts.XXXXXX" 2>/dev/null)"
          output_file="$(mktemp "${RUNNER_TEMP}/gateway-inspection-output.XXXXXX" 2>/dev/null)"
          error_file="$(mktemp "${RUNNER_TEMP}/gateway-ssh-error.XXXXXX" 2>/dev/null)"
          trap 'rm -f "${known_hosts}" "${output_file}" "${error_file}" "${SSH_KEY_FILE}" 2>/dev/null || true' EXIT
          if ! chmod 600 "${known_hosts}" "${output_file}" "${error_file}" 2>/dev/null; then
            echo "GATEWAY_CONNECTION_INSPECTION=blocked reason=inspection_unavailable"
            exit 1
          fi
          target_alias="gateway-target-${TARGET_INDEX}"
          # The temporary SSH host-key record is bound to this exact IAP target alias.
          proxy_command="gcloud compute start-iap-tunnel '${GCE_INSTANCE_NAME}' 22 --listen-on-stdin --project='${GCP_PROJECT_ID}' --zone='${GCE_ZONE}' --quiet"
          remote_command="bash -s -- '${IB_GATEWAY_CONTAINER_NAME}' '${IB_GATEWAY_API_PORT}'"
          if timeout 75 ssh \
            -i "${SSH_KEY_FILE}" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectionAttempts=1 \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            -o "UserKnownHostsFile=${known_hosts}" \
            -o "HostKeyAlias=${target_alias}" \
            -o "ProxyCommand=${proxy_command}" \
            "${GCE_USER}@${target_alias}" "${remote_command}" \
            < scripts/inspect_gateway_connections.sh >"${output_file}" 2>"${error_file}"; then
            ssh_status=0
          else
            ssh_status=$?
          fi
          python3 scripts/classify_gateway_ssh_failure.py \
            --stdout-file "${output_file}" \
            --stderr-file "${error_file}" \
            --exit-code "${ssh_status}"

      - name: Remove temporary SSH key
        if: ${{ always() && inputs.inspect_connections }}
        env:
          SSH_KEY_FILE: ${{ env.SSH_KEY_FILE }}
        run: |
          set -euo pipefail
          if [ -n "${SSH_KEY_FILE:-}" ]; then rm -f -- "${SSH_KEY_FILE}" 2>/dev/null || true; fi
          for key_file in "${RUNNER_TEMP}"/gateway-ssh-key.*; do
            [ -e "${key_file}" ] || continue
            rm -f -- "${key_file}" 2>/dev/null || true
          done
