name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run shell tests
        run: |
          set -euo pipefail
          bash tests/test_install_2fa_bot_watcher.sh
          bash tests/test_wait_for_ib_gateway_ready.sh
          bash tests/test_gateway_recovery_scripts.sh
          bash tests/test_monitor_ib_gateway_ready.sh
          bash tests/test_workflow_shared_config.sh
          bash tests/test_docker_compose_ports.sh
          bash tests/test_read_only_vm_metadata_diagnostic.sh
          bash tests/test_inspect_gateway_connections.sh
          node tests/test_filter_github_action_auth_logs.cjs
          node tests/test_parse_protected_gateway_index.cjs
          node tests/test_gateway_workflow_resolve.cjs
          python3 -m unittest discover -s tests -p 'test_match_gateway_metadata.py'

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build gateway image without runtime startup
        run: docker build --pull --tag ibkr-gateway-manager:ci .
